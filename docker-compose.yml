services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml_secret
      POSTGRES_DB: aml_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RESEARCH_ROOT: /research
      DATABASE_URL: postgresql://aml:aml_secret@postgres:5432/aml_platform
      JWT_SECRET: capstone-demo-jwt-change-in-production
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - .:/research:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
